<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f2ff" />
    <title>集卡司机端</title>
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="mobile-header" id="mobileHeader">
        <div class="header-copy">
          <span class="eyebrow" id="headerEyebrow">集卡司机端</span>
          <h1 id="mobileTitle">接单</h1>
        </div>
        <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="消息通知">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
          <span class="notification-dot"></span>
        </button>
      </header>

      <main class="mobile-main">
        <section class="mobile-view active" id="tasksView" data-title="接单">
          <div class="task-list" id="taskList"></div>
        </section>

        <section class="mobile-view" id="ordersView" data-title="我的运单">
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="orderSearch" type="search" placeholder="搜索运单号、线路或箱号" />
          </div>
          <div class="order-status-tabs" id="orderStatusTabs">
            <button class="active" data-status="all" type="button">全部</button>
            <button data-status="active" type="button">进行中</button>
            <button data-status="completed" type="button">已完成</button>
            <button data-status="cancelled" type="button">已取消</button>
          </div>
          <div class="order-list" id="orderList"></div>
        </section>

        <section class="mobile-view profile-view" id="profileView" data-title="个人中心">
          <div class="profile-hero">
            <div class="avatar" id="profileAvatar">赵</div>
            <div class="profile-copy">
              <div class="profile-name-line"><h2 id="profileName">赵亮</h2><button id="profileCertificationBadge" data-profile-page="certification" type="button">未认证</button></div>
              <p id="profileMeta">自有司机 · 临港车队</p>
              <small id="profilePhone">139****6662</small>
            </div>
            <button class="profile-edit" id="switchDriverButton" type="button" aria-label="切换演示司机">切换</button>
          </div>

          <section class="profile-order-panel">
            <header>
              <div><strong>我的运单</strong><span>运输任务进度</span></div>
              <button data-order-stage="all" type="button">查看全部 <b>›</b></button>
            </header>
            <div class="profile-order-stats" id="profileOrderStats"></div>
          </section>

          <section class="profile-menu-group">
            <h2>账户与安全</h2>
            <div class="profile-menu-list">
              <button data-profile-page="certification" type="button"><span class="profile-menu-icon orange"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>司机认证</span><em class="certification-state" id="certificationMenuStatus">未认证</em><b>›</b></button>
              <button data-profile-page="personal" type="button"><span class="profile-menu-icon blue"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span>个人信息</span><b>›</b></button>
              <button data-profile-page="documents" type="button"><span class="profile-menu-icon green"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.8-1.8 4.2-1.8 5 0M14 10h3M14 14h3"/></svg></span><span>证件管理</span><b>›</b></button>
              <button data-profile-page="security" type="button"><span class="profile-menu-icon purple"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg></span><span>账户安全</span><b>›</b></button>
            </div>
          </section>

          <section class="profile-menu-group">
            <h2>车辆信息</h2>
            <div class="profile-menu-list">
              <button data-profile-page="vehicle" type="button"><span class="profile-menu-icon blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V8l2-3h10l2 3v8M5 11h14M7 16v2M17 16v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg></span><span>车辆信息</span><b>›</b></button>
              <button data-profile-page="insurance" type="button"><span class="profile-menu-icon green"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>车辆保险</span><b>›</b></button>
            </div>
          </section>

          <section class="profile-menu-group">
            <h2>服务与设置</h2>
            <div class="profile-menu-list">
              <button data-profile-page="messages" type="button"><span class="profile-menu-icon orange"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><span>消息通知</span><em id="messageBadge">2</em><b>›</b></button>
              <button data-profile-page="service" type="button"><span class="profile-menu-icon blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-2v-7h4M4 12v5h4v-5H4M12 20h4"/></svg></span><span>联系调度</span><b>›</b></button>
              <button data-profile-page="settings" type="button"><span class="profile-menu-icon gray"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5L9 6.1a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L5 11a7 7 0 0 0 0 2l-2.1 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.5 3.1h5l.5-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4L19 13a7 7 0 0 0 .1-1Z"/></svg></span><span>系统设置</span><b>›</b></button>
            </div>
          </section>
          <p class="version-text">集卡司机端 · 原型版 1.0</p>
        </section>

        <section class="detail-view" id="detailView" aria-hidden="true">
          <header class="detail-nav">
            <button class="icon-button" id="backFromDetail" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <strong>接单详情</strong>
            <button class="icon-button" id="detailMoreButton" type="button" aria-label="更多">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
            </button>
          </header>
          <div class="detail-scroll" id="detailContent"></div>
          <div class="detail-action-bar" id="detailActionBar"></div>
        </section>

        <section class="subpage-view" id="profileSubpage" aria-hidden="true">
          <header class="detail-nav">
            <button class="icon-button" id="backFromSubpage" type="button" aria-label="返回个人中心">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <strong id="subpageTitle">个人信息</strong>
            <span></span>
          </header>
          <div class="subpage-scroll" id="subpageContent"></div>
        </section>
      </main>

      <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
        <button class="active" data-view="tasks" type="button">
          <span class="nav-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM8 7V5h8v2M8 12h8"/></svg></span><span>接单</span>
        </button>
        <button data-view="orders" type="button">
          <span class="nav-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg></span><span>运单</span>
        </button>
        <button data-view="profile" type="button">
          <span class="nav-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span>我的</span>
        </button>
      </nav>

      <dialog class="bottom-sheet" id="rejectDialog">
        <form id="rejectForm">
          <div class="sheet-handle"></div>
          <header><div><strong>拒绝本次派单</strong><span>拒单原因将同步给调度员</span></div><button class="sheet-close" value="cancel" formmethod="dialog" type="button">×</button></header>
          <div class="reason-options">
            <label><input type="radio" name="reason" value="车辆故障" required /><span>车辆故障</span></label>
            <label><input type="radio" name="reason" value="时间冲突" /><span>时间冲突</span></label>
            <label><input type="radio" name="reason" value="身体不适" /><span>身体不适</span></label>
            <label><input type="radio" name="reason" value="其他原因" /><span>其他原因</span></label>
          </div>
          <label class="sheet-field">补充说明<textarea name="remark" rows="3" placeholder="请补充说明（选填）"></textarea></label>
          <button class="primary-action danger-action" type="submit">确认拒绝</button>
        </form>
      </dialog>

      <dialog class="bottom-sheet" id="progressDialog">
        <form id="progressForm">
          <div class="sheet-handle"></div>
          <header><div><strong id="progressTitle">更新运输节点</strong><span id="progressHint">操作后将实时同步至调度后台</span></div><button class="sheet-close" type="button">×</button></header>
          <div class="next-node-card"><span>即将更新为</span><strong id="nextNodeText">已提货</strong></div>
          <label class="sheet-field">现场说明<textarea name="remark" rows="3" placeholder="填写现场情况或异常说明"></textarea></label>
          <label class="upload-box">
            <input name="photos" type="file" accept="image/*" multiple />
            <span class="upload-icon">＋</span><strong>上传现场照片</strong><small id="uploadHint">支持从相册选择或拍照</small>
          </label>
          <button class="primary-action" type="submit">确认上报</button>
        </form>
      </dialog>

      <dialog class="bottom-sheet compact-sheet" id="driverDialog">
        <div class="sheet-handle"></div>
        <header><div><strong>切换演示司机</strong><span>用于查看不同司机的派单数据</span></div><button class="sheet-close" type="button">×</button></header>
        <div class="driver-options" id="driverOptions"></div>
      </dialog>

      <div class="toast" id="toast" role="status"></div>
    </div>

    <script src="dispatch-store.js"></script>
    <script src="mobile.js"></script>
  </body>
</html>
